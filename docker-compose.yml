services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: octacore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - octaweb-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octacore"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/octacore?schema=octacore
      FRONTEND_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:3333
      JWT_ACCESS_SECRET: altere-este-segredo-access-com-32-caracteres
      JWT_REFRESH_SECRET: altere-este-segredo-refresh-com-32-caracteres
      JWT_RESET_SECRET: altere-este-segredo-reset-com-32-caracteres
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      RESET_TOKEN_TTL: 15m
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: 2097152
      PASSWORD_RESET_URL: http://localhost:3000/redefinir-senha
    ports:
      - "3333:3333"
    volumes:
      - octaweb-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
    environment:
      API_URL: http://api:3333/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  octaweb-pgdata:
  octaweb-uploads:
